name: CI
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:forky-slim
    steps:
      - name: install CI dependencies
        run: |
          # The default deb.debian.org archive is slow/unreachable from the
          # runner; switch to a nearby Debian mirror before installing.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's|deb.debian.org|mirrors.tuna.tsinghua.edu.cn|g' \
                -e 's|security.debian.org|mirrors.tuna.tsinghua.edu.cn|g' \
                "$f"
            fi
          done
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs emacs-gtk xvfb xauth build-essential \
            pkg-config libmupdf-dev
          mupdf_package_version=$(dpkg-query -W -f='${Version}' libmupdf-dev)
          dpkg --compare-versions "$mupdf_package_version" ge 1.26
          # Debian's mupdf.pc reports 1.24.10 even when the package is newer.
          # Keep the upstream version accurate for emacs-reader's Makefile.
          mupdf_upstream_version=${mupdf_package_version%%+*}
          mupdf_pc=$(pkg-config --variable=pcfiledir mupdf)/mupdf.pc
          sed -i "s/^Version:.*/Version: $mupdf_upstream_version/" "$mupdf_pc"
          test "$(pkg-config --modversion mupdf)" = "$mupdf_upstream_version"
          emacs --batch -Q --eval '(unless (and module-file-suffix (fboundp '\''module-load)) (error "Emacs was built without dynamic module support"))'
      - name: checkout
        uses: actions/checkout@v4
      - name: put prelude in the right place
        run: |
          ln -sfn "$(pwd)" "$HOME/.emacs.d"
          mkdir -p vendor
      - name: load prelude
        run: emacs --batch --load init.el
      - name: run unit tests
        run: test/run-unit-tests.sh
      - name: exercise emacs-reader in a graphical Emacs
        run: |
          timeout --signal=TERM --kill-after=30s 10m \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            emacs -Q --load .github/scripts/reader-gui-smoke.el
